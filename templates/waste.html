<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Prediction | CityPulse AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>CityPulse AI</h2>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/waste">Waste Prediction</a>
</nav>

<section class="form-card">

    <h1>Waste Prediction</h1>

    <p>
        Enter the required city information to generate an intelligent waste
        prediction using the trained machine learning model.
    </p>

    <form method="POST">

        <div>
            <label for="borough">Borough</label>
            <input
                id="borough"
                name="borough"
                type="text"
                placeholder="Enter borough name"
                required
            >
        </div>

        <div>
            <label for="district">District</label>
            <input
                id="district"
                name="district"
                type="number"
                placeholder="Enter district number"
                required
            >
        </div>

        <div>
            <label for="year">Year</label>
            <input
                id="year"
                name="year"
                type="number"
                placeholder="Enter year"
                required
            >
        </div>

        <button type="submit">Generate Prediction</button>

    </form>

</section>

</body>
</html>
